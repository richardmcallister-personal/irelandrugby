<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0a6b3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ireland Rugby"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet"><link rel="stylesheet" href="/rugby.css"><script src="/rugby.js"></script><title>Team · Ireland Rugby</title></head><body>
<script>IR.shell('tables')</script>
<main id="main" class="wrap"><div id="p"><p class="empty">Loading…</p></div></main>
<script>
(async () => {
  const el = document.getElementById('p'), esc = IR.esc;
  const slug = new URLSearchParams(location.search).get('s') || '';
  if (IR.TEAMS[slug]) { location.replace('/' + slug + '/'); return; }
  try {
    const [S, d, hist] = await Promise.all([fetch('/data/sides.json').then((r) => r.json()), IR.data().catch(() => null), fetch('/api/history').then((r) => (r.ok ? r.json() : [])).catch(() => [])]);
    const t = S[slug];
    if (!t) { el.innerHTML = '<section class="card"><p class="empty">No page for this team yet. <a href="/tables/">Back to the tables</a>.</p></section>'; IR.footer(null); return; }
    document.title = `${t.name} · Ireland Rugby`;
    const nation = t.kind === 'nation';
    // This season's tables that include the team
    const NAMES = { urc: 'United Rugby Championship', cc: 'Champions Cup', ch: 'Challenge Cup', nc: 'Nations Championship', six: 'Six Nations' };
    const comps = [];
    for (const [k, ts] of Object.entries(d?.tables || {})) for (const tb of ts) { const r = tb.rows.find((x) => x.s === slug); if (r) comps.push({ k, name: tb.name || NAMES[k], r, n: tb.rows.length }); }
    // Results against Ireland and the provinces since 2020
    const ms = hist.filter((m) => /^Finished/.test(m.state) && m.score && ((m.h.s === slug && IR.TEAMS[m.a.s]) || (m.a.s === slug && IR.TEAMS[m.h.s])));
    const vs = {};
    for (const m of ms) { const ir = m.h.s === slug ? m.a.s : m.h.s; const [x, y] = m.h.s === ir ? m.score : [m.score[1], m.score[0]]; const o = vs[ir] || (vs[ir] = { w: 0, d: 0, l: 0, last: m }); x > y ? o.w++ : x < y ? o.l++ : o.d++; if (m.date > o.last.date) o.last = m; }
    const ICON = { web: ['Website', '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'], x: ['X', '<path d="M4 4l16 16M20 4 4 20"/>'], ig: ['Instagram', '<rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3.5"/>'], fb: ['Facebook', '<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/>'], yt: ['YouTube', '<rect x="3" y="6" width="18" height="12" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/>'], tt: ['TikTok', '<path d="M14 4v10a3.5 3.5 0 1 1-3.5-3.5M14 4c0 2.5 2 4.5 4.5 4.5"/>'] };
    const URL_ = { web: (v) => v, x: (v) => 'https://x.com/' + v, ig: (v) => 'https://www.instagram.com/' + v, fb: (v) => 'https://www.facebook.com/' + v, yt: (v) => 'https://www.youtube.com/channel/' + v, tt: (v) => 'https://www.tiktok.com/@' + v };
    const links = Object.keys(ICON).filter((k) => t[k]).map((k) => `<a href="${esc(URL_[k](t[k]))}" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k][1]}</svg>${ICON[k][0]}</a>`).join('');
    const map = t.lat != null ? `https://www.openstreetmap.org/?mlat=${t.lat}&mlon=${t.lon}#map=15/${t.lat}/${t.lon}` : null;
    const POSN = { HK: 'Hookers', PR: 'Props', LK: 'Locks', LF: 'Back row', FL: 'Back row', BR: 'Back row', N8: 'Back row', SH: 'Scrum-halves', HB: 'Scrum-halves', FH: 'Fly-halves', FF: 'Fly-halves', CE: 'Centres', MF: 'Centres', WG: 'Wings', FB: 'Full-backs', UB: 'Utility backs', OB: 'Wings and full-backs' };
    const groups = {};
    for (const p of t.squad || []) { const g = nation ? POSN[p.pos] || p.pos || 'Squad' : p.pos || 'Squad'; (groups[g] || (groups[g] = [])).push(p); }
    const NAT = { ENG: 'England', SCO: 'Scotland', WAL: 'Wales', IRE: 'Ireland', FRA: 'France', ITA: 'Italy', RSA: 'South Africa', NZL: 'New Zealand', AUS: 'Australia', ARG: 'Argentina', FIJ: 'Fiji', SAM: 'Samoa', TGA: 'Tonga', TON: 'Tonga', JPN: 'Japan', GEO: 'Georgia', USA: 'United States', CAN: 'Canada', URU: 'Uruguay', ROU: 'Romania', ROM: 'Romania', NAM: 'Namibia', POR: 'Portugal', ESP: 'Spain', CHI: 'Chile', ZIM: 'Zimbabwe', NED: 'Netherlands', BEL: 'Belgium', GER: 'Germany', HKG: 'Hong Kong', RUS: 'Russia' };
    const squad = Object.entries(groups).map(([g, ps]) => `<section><h3>${esc(g)}</h3><ul>${ps.map((p) => `<li><span>${esc(p.n)}${p.c ? ' <b title="Captain">(c)</b>' : ''}</span><small>${nation ? [p.caps != null ? p.caps + (p.caps === 1 ? ' cap' : ' caps') : '', p.club].filter(Boolean).map(esc).join(' · ') : esc(NAT[p.nat] || p.nat || '') + (p.cap ? ' · international' : '')}</small></li>`).join('')}</ul></section>`).join('');
    const facts = [['Coach', t.coach], ['Captain', t.captain], ['Founded', t.founded], ['League', t.league], ['Nickname', t.nick], ['Most caps', t.most_caps], ['Top points scorer', t.top_scorer], ['Most tries', t.top_try]].filter((x) => x[1]);
    el.innerHTML = `<nav class="tnav" aria-label="Back"><a href="/tables/">‹ Tables</a><span></span></nav>
      <section class="shero">${IR.logo({ s: ['russia', 'zimbabwe'].includes(slug) ? null : slug, n: t.name }, 'big')}<div><h1>${esc(t.name)}</h1><p>${[nation ? 'National team' : 'Club', t.location || t.country].filter(Boolean).map(esc).join(' · ')}</p></div></section>
      ${links ? `<section class="card"><h2>Official links</h2><div class="links">${links}</div></section>` : ''}
      <div class="two"><section class="card"><h2>Ground</h2>${(t.grounds || []).length ? t.grounds.map((g) => `<div class="ground"><b>${esc(g[0])}</b><span>${g[1] || ''}</span><small class="note" style="margin:0">${g[1] ? 'Capacity' : 'Capacity not recorded'}</small></div>`).join('') : `<p class="empty">${nation ? 'Plays home games at several grounds.' : 'Not recorded.'}</p>`}
        ${t.record_att ? `<p class="note">Ground record crowd: ${esc(t.record_att)}</p>` : ''}${t.note ? `<p class="note">${esc(t.note)}</p>` : ''}
        <p class="note">${esc(t.location || t.country || '')}${map ? ` · <a href="${map}" target="_blank" rel="noopener">Map</a>` : ''}</p></section>
      <section class="card"><h2>About</h2><dl class="facts txt">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></section></div>
      <div class="two"><section class="card"><h2>Competitions this season</h2>${comps.length ? `<table class="pl"><tbody>${comps.map((c) => `<tr><td><a href="/tables/">${esc(c.name)}</a><small>${c.r.p} played · ${c.r.w}-${c.r.d}-${c.r.l} · ${c.r.pts} points</small></td><td style="text-align:right"><b>${IR.esc(String(c.r.pos))}</b><small>of ${c.n}</small></td></tr>`).join('')}</tbody></table>` : '<p class="empty">Not in any table we follow this season.</p>'}${t.league && !comps.some((c) => c.name.includes(t.league)) ? `<p class="note">Also plays in the ${esc(t.league)}.</p>` : ''}</section>
      <section class="card"><h2>Against Irish teams</h2>${Object.keys(vs).length ? `<table class="pl"><tbody>${Object.entries(vs).map(([ir, o]) => `<tr><td><a href="/h2h/?a=${ir}&b=${encodeURIComponent(slug)}">${IR.TEAMS[ir]}</a><small>Last met ${IR.fmtDay(o.last.date)}</small></td><td style="text-align:right"><b>${o.w}-${o.d}-${o.l}</b><small>${IR.TEAMS[ir]} won, drew, lost</small></td></tr>`).join('')}</tbody></table><p class="note">Matches since 2020.</p>` : '<p class="empty">No matches against Ireland or the provinces since 2020.</p>'}</section></div>
      <section class="card"><h2>${nation ? 'Latest squad' : 'Squad'}</h2>${squad ? `<div class="squad">${squad}</div>` : '<p class="empty">Squad not listed in the source.</p>'}<p class="note">${nation ? 'The most recent squad named, with caps at the time.' : 'This season\'s senior squad. International means capped by a country.'}</p></section>
      <p class="note">Source: <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(t.page.replace(/ /g, '_'))}" target="_blank" rel="noopener">${esc(t.page)}</a>, Wikipedia (CC BY-SA), and Wikidata, checked 7 November 2026. Links go to the team's own accounts.</p>`;
  } catch (e) { console.error(e); IR.fail(el); }
  IR.footer(null);
})();
</script></body></html>
