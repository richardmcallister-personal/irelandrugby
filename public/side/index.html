<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0a6b3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ireland Rugby"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet"><link rel="stylesheet" href="/rugby.css"><script src="/rugby.js"></script><script src="/side.js"></script><title>Team · Ireland Rugby</title></head><body>
<script>IR.shell('tables')</script>
<main id="main" class="wrap"><div id="p"><p class="empty">Loading…</p></div></main>
<script>
(async () => {
  const el = document.getElementById('p'), esc = IR.esc;
  const slug = new URLSearchParams(location.search).get('s') || '';
  if (IR.TEAMS[slug]) { location.replace('/' + slug + '/'); return; }
  try {
    const [S, d, hist] = await Promise.all([SIDE.load(), IR.data().catch(() => null), fetch('/api/history').then((r) => (r.ok ? r.json() : [])).catch(() => [])]);
    const t = S[slug];
    if (!t) { el.innerHTML = '<section class="card"><p class="empty">No page for this team yet. <a href="/tables/">Back to the tables</a>.</p></section>'; IR.footer(null); return; }
    document.title = `${t.name} · Ireland Rugby`;
    const nation = t.kind === 'nation';
    // This season's tables that include the team
    const NAMES = { urc: 'United Rugby Championship', cc: 'Champions Cup', ch: 'Challenge Cup', nc: 'Nations Championship', six: 'Six Nations' };
    const comps = [];
    for (const [k, ts] of Object.entries(d?.tables || {})) for (const tb of ts) { const r = tb.rows.find((x) => x.s === slug); if (r) comps.push({ k, name: tb.name || NAMES[k], r, n: tb.rows.length }); }
    // Results against Ireland and the provinces since 2020
    const ms = hist.filter((m) => /^Finished/.test(m.state) && m.score && ((m.h.s === slug && IR.TEAMS[m.a.s]) || (m.a.s === slug && IR.TEAMS[m.h.s])));
    const vs = {};
    for (const m of ms) { const ir = m.h.s === slug ? m.a.s : m.h.s; const [x, y] = m.h.s === ir ? m.score : [m.score[1], m.score[0]]; const o = vs[ir] || (vs[ir] = { w: 0, d: 0, l: 0, last: m }); x > y ? o.w++ : x < y ? o.l++ : o.d++; if (m.date > o.last.date) o.last = m; }
    el.innerHTML = `<nav class="tnav" aria-label="Back"><a href="/tables/">‹ Tables</a><span></span></nav>
      <section class="shero">${IR.logo({ s: ['russia', 'zimbabwe'].includes(slug) ? null : slug, n: t.name }, 'big')}<div><h1>${esc(t.name)}</h1><p>${[nation ? 'National team' : 'Club', t.location || t.country].filter(Boolean).map(esc).join(' · ')}</p></div></section>
      ${SIDE.links(t)}
      <div class="two">${SIDE.ground(t)}${SIDE.about(t)}</div>
      <div class="two"><section class="card"><h2>Competitions this season</h2>${comps.length ? `<table class="pl"><tbody>${comps.map((c) => `<tr><td><a href="/tables/">${esc(c.name)}</a><small>${c.r.p} played · ${c.r.w}-${c.r.d}-${c.r.l} · ${c.r.pts} points</small></td><td style="text-align:right"><b>${IR.esc(String(c.r.pos))}</b><small>of ${c.n}</small></td></tr>`).join('')}</tbody></table>` : '<p class="empty">Not in any table we follow this season.</p>'}${t.league && !comps.some((c) => c.name.includes(t.league)) ? `<p class="note">Also plays in the ${esc(t.league)}.</p>` : ''}</section>
      <section class="card"><h2>Against Irish teams</h2>${Object.keys(vs).length ? `<table class="pl"><tbody>${Object.entries(vs).map(([ir, o]) => `<tr><td><a href="/h2h/?a=${ir}&b=${encodeURIComponent(slug)}">${IR.TEAMS[ir]}</a><small>Last met ${IR.fmtDay(o.last.date)}</small></td><td style="text-align:right"><b>${o.w}-${o.d}-${o.l}</b><small>${IR.TEAMS[ir]} won, drew, lost</small></td></tr>`).join('')}</tbody></table><p class="note">Matches since 2020.</p>` : '<p class="empty">No matches against Ireland or the provinces since 2020.</p>'}</section></div>
      ${SIDE.squad(t)}
      ${SIDE.source(t)}`;
  } catch (e) { console.error(e); IR.fail(el); }
  IR.footer(null);
})();
</script></body></html>
