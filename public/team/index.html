<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0a6b3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ireland Rugby"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet"><link rel="stylesheet" href="/rugby.css"><script src="/rugby.js"></script><title>Ireland Rugby</title></head><body>
<script>const SLUG = location.pathname.split('/')[1]; IR.shell(SLUG);</script>
<div class="hero" id="hero"></div>
<main id="main" class="wrap">
<section class="card" id="nextc"><h2>Next match</h2><div id="next"><p class="empty">Loading…</p></div></section>
<div class="two"><div>
<section class="card"><h2>Results</h2><div id="res"></div><button class="more" id="more" hidden>Show more</button></section>
</div><div>
<section class="card"><h2>Fixtures</h2><div id="fix"></div></section>
<div id="tabs"></div>
<section class="card"><h2>Current kits</h2><div class="kits" id="kits"></div><p class="note"><a id="shirtl" href="/shirts/">Older shirts</a> · <a id="h2hl" href="/h2h/">Head to head</a> · <a id="pll" href="/players/">Players</a></p></section>
</div></div>
</main>
<script>
(async () => {
  const name = IR.TEAMS[SLUG];
  if (!name) { location.replace('/'); return; }
  document.title = name + ' · Ireland Rugby';
  document.getElementById('shirtl').href = '/shirts/?team=' + SLUG; document.getElementById('h2hl').href = '/h2h/?a=' + SLUG; document.getElementById('pll').href = '/players/?team=' + SLUG;
  const KITS = {
    ireland: [['2026-27-home', '2026/27 home'], ['2026-27-away', '2026/27 away']],
    munster: [['2025-27-home', '2025-27 home'], ['2026-27-away', '2026/27 away'], ['2026-28-european', '2026-28 European']],
    leinster: [['2026-27-home', '2026/27 home'], ['2026-27-away', '2026/27 away'], ['2026-27-european', '2026/27 European']],
    ulster: [['2026-27-home', '2026/27 home'], ['2026-27-away', '2026/27 away'], ['2026-27-third', '2026/27 third']],
    connacht: [['2026-27-home', '2026/27 home'], ['2026-27-away', '2026/27 away']],
  };
  document.getElementById('kits').innerHTML = KITS[SLUG].map(([f, c]) => `<figure><img src="/img/kit/${SLUG}-${f}.webp" alt="${name} ${c} shirt" loading="lazy" width="240" height="270"><figcaption>${c}</figcaption></figure>`).join('');
  const hero = (form) => `<div class="in" style="--tc:var(--${SLUG})"><img src="/img/crest/${SLUG}-white.webp" alt="" width="92" height="92"><div><h1>${name}</h1>${form}</div></div>`;
  const h = document.getElementById('hero'); h.style.setProperty('--tc', 'var(--' + SLUG + ')'); h.innerHTML = hero('');
  try {
    const d = await IR.data();
    const ms = d.matches.filter((m) => IR.has(m, SLUG));
    const past = IR.results(ms), fut = IR.upcoming(ms);
    const last5 = past.slice(0, 5).reverse().map((m) => IR.result(m, SLUG));
    h.innerHTML = hero(last5.length ? '<div class="form" aria-label="Form, oldest first">' + last5.map((r) => `<i class="${r}">${r}</i>`).join('') + '</div>' : '');
    const nx = fut[0];
    document.getElementById('next').innerHTML = nx ? `<div class="next"><div class="t">${IR.logo(nx.h, 'big')}${IR.esc(nx.h.n)}</div><div class="mid">${IR.fmtDay(nx.date)}<br>${IR.fmtTime(nx.date)}<small>${IR.irishTime(nx.date)}</small><small>${IR.esc(IR.compName(nx))}${nx.venue ? ' · ' + IR.esc(nx.venue) : ''}</small></div><div class="t">${IR.logo(nx.a, 'big')}${IR.esc(nx.a.n)}</div></div>` : '<p class="empty">No fixture listed.</p>';
    document.getElementById('fix').innerHTML = IR.byDay(fut) || '<p class="empty">No fixtures listed.</p>';
    let shown = 10; const more = document.getElementById('more');
    const draw = () => { document.getElementById('res').innerHTML = IR.byDay(past.slice(0, shown)) || '<p class="empty">No results yet.</p>'; more.hidden = shown >= past.length; };
    more.onclick = () => { shown += 20; draw(); }; draw();
    let t = '';
    for (const [code, groups] of Object.entries(d.tables)) for (const g of groups) {
      if (!g.rows.some((r) => r.s === SLUG)) continue;
      t += `<section class="card"><h2>${IR.esc(IR.COMP[code]?.[1] || code)}</h2>${g.name && groups.length > 1 ? '<div class="grp">' + IR.esc(g.name.replace(/^.*,\s*/, '')) + '</div>' : ''}${table(g.rows)}</section>`;
    }
    document.getElementById('tabs').innerHTML = t;
    IR.footer(d.updated);
  } catch (e) { IR.fail(document.getElementById('next')); IR.footer(null); }
  function table(rows) {
    return '<table class="tbl"><thead><tr><th></th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr></thead><tbody>' + rows.map((r) => `<tr class="${r.s === SLUG ? 'irish' : ''}"><td>${r.pos}</td><td class="tm"><span class="tmi">${IR.logo(r)}${IR.esc(r.n)}</span></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td class="pts">${r.pts}</td></tr>`).join('') + '</tbody></table>';
  }
})();
</script></body></html>
