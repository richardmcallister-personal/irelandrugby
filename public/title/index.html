<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0a6b3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ireland Rugby"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet"><link rel="stylesheet" href="/rugby.css"><script src="/rugby.js"></script><title>Championship · Ireland Rugby</title></head><body>
<script>IR.shell('titles')</script>
<main id="main" class="wrap"><div id="p"><p class="empty">Loading…</p></div></main>
<script>
(async () => {
  const el = document.getElementById('p');
  const N = { IRE: 'Ireland', ENG: 'England', SCO: 'Scotland', WAL: 'Wales', FRA: 'France', ITA: 'Italy' };
  const S = { IRE: 'ireland', ENG: 'england', SCO: 'scotland', WAL: 'wales', FRA: 'france', ITA: 'italy' };
  const t2 = (c) => ({ s: S[c], n: N[c] || c });
  const esc = IR.esc;
  const fd = (d) => d ? new Date(d + 'T12:00:00Z').toLocaleDateString('en-IE', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }) : 'Date not recorded';
  try {
    const { titles: T, images: I } = await (await fetch('/data/titles.json')).json();
    const y = Number(new URLSearchParams(location.search).get('y'));
    const i = T.findIndex((x) => x.y === y);
    if (i < 0) { el.innerHTML = '<section class="card"><p class="empty">Not one of Ireland\'s title years. <a href="/titles/">All championships</a>.</p></section>'; IR.footer(null); return; }
    const t = T[i];
    document.title = `${t.y} ${t.comp} · Ireland Rugby`;
    const credit = (k) => I[k] ? `${esc(I[k].by)}, <a href="${esc(I[k].src)}" target="_blank" rel="noopener">${esc(I[k].lic)}</a>` : '';
    const ground = t.y >= 2010 ? ['aviva', 'Aviva Stadium, Dublin, Ireland\'s home since 2010'] : t.y === 2009 ? ['croke-park', 'Croke Park, Dublin, Ireland\'s home in 2009 (photo from 2004)'] : ['lansdowne-road', 'Lansdowne Road, Dublin, Ireland\'s main home until 2006 (photo from 2006)'];
    const im = t.matches.filter((m) => m.h === 'IRE' || m.a === 'IRE');
    let w = 0, d = 0, l = 0, pf = 0, pa = 0;
    for (const m of im) { const [x, z] = m.h === 'IRE' ? m.s : [m.s[1], m.s[0]]; pf += x; pa += z; x > z ? w++ : x < z ? l++ : d++; }
    const badges = [`<span class="badge gold">${t.shared ? 'Shared champions' : 'Champions'}</span>`, t.gs ? '<span class="badge gs">Grand Slam</span>' : '', t.tc ? '<span class="badge tc">Triple Crown</span>' : '', t.shared ? `<span class="badge">With ${t.with.map(esc).join(', ')}</span>` : ''].join('');
    const prev = T[i - 1], next = T[i + 1];
    // Ireland's scorers, counted by type (point values changed over the years, so no points total)
    const tally = {};
    for (const m of im) { const sd = m.sc[m.h === 'IRE' ? 'h' : 'a'] || {}; for (const k of ['try', 'con', 'pen', 'drop']) for (const r of sd[k] || []) { if (/penalty try/i.test(r[0])) continue; const o = tally[r[0]] || (tally[r[0]] = { n: r[0], try: 0, con: 0, pen: 0, drop: 0 }); o[k] += r[2]; } }
    const tl = Object.values(tally).sort((a, b) => b.try - a.try || (b.con + b.pen + b.drop) - (a.con + a.pen + a.drop));
    const lines = (s) => { const L = [['try', 'Tries'], ['con', 'Conversions'], ['pen', 'Penalties'], ['drop', 'Drop goals']].filter(([k]) => (s?.[k] || []).length).map(([k, lab]) => `<p class="scl"><b>${lab}</b> ${s[k].map((r) => esc(r[1]) + (r[2] > 1 ? ' ' + r[2] : '') + (r[3].length && k === 'try' ? ` <small>${r[3].map((x) => x + "'").join(', ')}</small>` : '')).join(', ')}</p>`).join(''); return L || '<p class="note" style="margin:0">Scorers not recorded in the source.</p>'; };
    const card = (m) => {
      const ih = m.h === 'IRE', [x, z] = ih ? m.s : [m.s[1], m.s[0]], r = x > z ? 'W' : x < z ? 'L' : 'D';
      const xi = m.xi?.IRE; const kit = I['kit-' + m.date] ? 'kit-' + m.date : null;
      return `<div class="mcard"><div class="mhd"><div class="t">${IR.logo(t2(m.h), 'big')}${esc(N[m.h])}</div><div class="s">${m.s[0]}-${m.s[1]}<small class="res-${r}">${r === 'W' ? 'Ireland won' : r === 'L' ? 'Ireland lost' : 'Draw'}</small></div><div class="t">${IR.logo(t2(m.a), 'big')}${esc(N[m.a])}</div></div>
        <p class="mmeta">${fd(m.date)}${m.venue ? ' · ' + esc(m.venue) : ''}${m.att ? ' · Crowd ' + m.att : ''}${m.ref ? ' · Referee ' + esc(m.ref) : ''}</p>
        <div class="mbody"><div><h3>${esc(N[m.h])} scorers</h3>${lines(m.sc.h)}</div><div><h3>${esc(N[m.a])} scorers</h3>${lines(m.sc.a)}</div>
        ${xi ? `<div style="grid-column:1/-1"><h3>Ireland team</h3><ol class="xi">${xi.map((p) => `<li><b>${p[0]}</b>${esc(p[1])}</li>`).join('')}</ol></div>` : ''}</div>
        ${kit ? `<details class="diag"><summary>Line-up diagram</summary><img src="/img/titles/${kit}.webp" alt="Line-ups and kits, ${esc(N[m.h])} v ${esc(N[m.a])}" loading="lazy" width="${I[kit].w}" height="${I[kit].h}"><p class="note">Diagram: ${credit(kit)}</p></details>` : ''}</div>`;
    };
    const tab = `<table class="tbl"><thead><tr><th></th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th class="wide">PF</th><th class="wide">PA</th><th>Pts</th></tr></thead><tbody>${t.table.map((r, k) => `<tr class="${r.c === 'IRE' ? 'irish' : ''}"><td>${k + 1}</td><td class="tm"><span class="tmi">${IR.logo(t2(r.c))}${esc(N[r.c] || r.c)}</span></td><td>${r.w + r.d + r.l}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td class="wide">${r.pf}</td><td class="wide">${r.pa}</td><td class="pts">${r.pts}</td></tr>`).join('')}</tbody></table><p class="note">${t.y >= 2017 ? 'Four points for a win, two for a draw, plus bonus points.' : 'Two points for a win, one for a draw. Points totals are worked out with that rule.'}</p>`;
    const others = t.matches.filter((m) => m.h !== 'IRE' && m.a !== 'IRE');
    const gal = [];
    if (t.y === 1899) for (const k of ['1899-tug-of-war', '1899-warrior']) if (I[k]) gal.push([k, 'Newspaper cartoon by J. M. Staniforth, 1899']);
    if (t.y >= 2000 && I['six-nations-trophy']) gal.push(['six-nations-trophy', 'The Six Nations trophy']);
    if (t.tc && t.y >= 2006 && I['triple-crown']) gal.push(['triple-crown', 'The Triple Crown trophy']);
    if (im.some((m) => /ravenhill/i.test(m.venue || ''))) gal.push(['ravenhill', 'Ravenhill, Belfast, where Ireland played that season (modern photo)']);
    el.innerHTML = `<nav class="tnav" aria-label="Other titles">${prev ? `<a href="?y=${prev.y}">‹ ${prev.y}</a>` : '<span></span>'}<a href="/titles/">All championships</a>${next ? `<a href="?y=${next.y}">${next.y} ›</a>` : '<span></span>'}</nav>
      <section class="thero"><div class="tx"><span class="yr">${t.y}</span><h1>${esc(t.comp)}</h1><div class="badges">${badges}</div><p class="note" style="margin:0">${esc(t.dates || '')}</p></div><figure><img src="/img/titles/${ground[0]}.webp" alt="${esc(ground[1])}" width="${I[ground[0]].w}" height="${I[ground[0]].h}"><figcaption>${esc(ground[1])}. ${credit(ground[0])}</figcaption></figure></section>
      <div class="stats"><div><b>${w}-${d}-${l}</b><span>Ireland won, drew, lost</span></div><div><b>${pf}-${pa}</b><span>Points for and against</span></div><div><b>${tl.reduce((a, b) => a + b.try, 0) || '–'}</b><span>Ireland tries recorded</span></div><div><b>${t.matches.length}</b><span>Matches in the championship</span></div></div>
      <div class="two"><section class="card"><h2>Table</h2>${tab}</section><section class="card"><h2>Ireland's scorers</h2>${tl.length ? `<table class="pl"><thead><tr><th>Player</th><th>Tries</th><th>Con</th><th>Pen</th><th>Drop</th></tr></thead><tbody>${tl.map((o) => `<tr><td>${esc(o.n)}</td><td>${o.try || ''}</td><td>${o.con || ''}</td><td>${o.pen || ''}</td><td>${o.drop || ''}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">The source does not record Ireland\'s scorers for this championship.</p>'}${t.top_pts ? `<p class="note">Top points scorer of the championship: ${esc(t.top_pts)}${t.top_tries ? '. Top try scorer: ' + esc(t.top_tries) : ''}</p>` : ''}</section></div>
      <section class="card"><h2>Ireland's matches</h2>${im.map(card).join('')}</section>
      ${others.length ? `<section class="card"><h2>Other results</h2><table class="pl"><tbody>${others.map((m) => `<tr><td>${esc(N[m.h])} <b>${m.s[0]}-${m.s[1]}</b> ${esc(N[m.a])}<small>${fd(m.date)}${m.venue ? ' · ' + esc(m.venue) : ''}</small></td></tr>`).join('')}</tbody></table></section>` : ''}
      ${gal.length ? `<section class="card"><h2>Pictures</h2><div class="gallery">${gal.map(([k, c]) => `<figure><img src="/img/titles/${k}.webp" alt="${esc(c)}" loading="lazy" width="${I[k].w}" height="${I[k].h}"><figcaption>${esc(c)}. ${credit(k)}</figcaption></figure>`).join('')}</div></section>` : ''}
      <p class="note">Source: <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(t.page.replace(/ /g, '_'))}" target="_blank" rel="noopener">${esc(t.page)}</a>, Wikipedia (CC BY-SA). Older articles often leave out scorers, crowds and teams.</p>`;
  } catch (e) { IR.fail(el); }
  IR.footer(null);
})();
</script></body></html>
