<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0a6b3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ireland Rugby"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet"><link rel="stylesheet" href="/rugby.css"><script src="/rugby.js"></script><title>Ireland's championships · Ireland Rugby</title></head><body>
<script>IR.shell('titles')</script>
<main id="main" class="wrap"><h1 class="pagehd">Ireland's championships</h1>
<p class="note">Every Home Nations, Five Nations and Six Nations title Ireland have won or shared, from 1894 to 2024. From Wikipedia, checked 7 November 2026.</p><div style="height:10px"></div>
<div class="stats" id="st"></div>
<section class="card"><div class="filters" style="margin-top:0"><select id="f" aria-label="Show"><option value="">All 24</option><option value="out">Won outright</option><option value="sh">Shared</option><option value="gs">Grand Slams</option><option value="tc">Triple Crowns</option></select></div><div class="tlist" id="l"><p class="empty">Loading…</p></div></section></main>
<script>
(async () => {
  try {
    const { titles: T } = await (await fetch('/data/titles.json')).json();
    const rec = (t) => { let w = 0, d = 0, l = 0; for (const m of t.matches) { if (m.h !== 'IRE' && m.a !== 'IRE') continue; const [x, y] = m.h === 'IRE' ? m.s : [m.s[1], m.s[0]]; x > y ? w++ : x < y ? l++ : d++; } return `${w}-${d}-${l}`; };
    document.getElementById('st').innerHTML = `<div><b>${T.length}</b><span>Titles, won or shared</span></div><div><b>${T.filter((t) => !t.shared).length}</b><span>Won outright</span></div><div><b>${T.filter((t) => t.gs).length}</b><span>Grand Slams</span></div><div><b>${T.filter((t) => t.tc).length}</b><span>Triple Crowns in title years</span></div>`;
    const draw = () => { const f = document.getElementById('f').value;
      const L = T.filter((t) => !f || (f === 'out' && !t.shared) || (f === 'sh' && t.shared) || (f === 'gs' && t.gs) || (f === 'tc' && t.tc)).slice().reverse();
      document.getElementById('l').innerHTML = L.map((t) => `<a class="trow" href="/title/?y=${t.y}"><span class="y">${t.y}</span><span class="n">${t.comp}<small>${t.shared ? 'Shared with ' + t.with.join(', ') : 'Won outright'}${t.gs ? ' · Grand Slam' : ''}${t.tc ? ' · Triple Crown' : ''}</small></span><span class="r">W-D-L<br>${rec(t)}</span></a>`).join(''); };
    document.getElementById('f').onchange = draw; draw();
  } catch (e) { IR.fail(document.getElementById('l')); }
  IR.footer(null);
})();
</script></body></html>
